<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
    <radialGradient id="innerGlow" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Outer Theme Ring / Shadow Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" />
  
  <!-- Subtle Lighting Overlay -->
  <circle cx="32" cy="32" r="30" fill="url(#innerGlow)" />

  <!-- Inner Contrast Ring -->
  <circle cx="32" cy="32" r="23" fill="#0f172a" opacity="0.18" />

  <!-- Core Accent Dot -->
  <circle cx="32" cy="32" r="14" fill="#ffffff" opacity="0.9" />
</svg>

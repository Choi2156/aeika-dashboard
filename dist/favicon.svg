<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171b26" />
      <stop offset="100%" stop-color="#0b0c10" />
    </linearGradient>
    <linearGradient id="calHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="barMint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barSky" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67dbed" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="6" y="10" width="52" height="48" rx="13" />
    </clipPath>
  </defs>

  <!-- Outer Dark Obsidian Card -->
  <g clip-path="url(#cardClip)">
    <rect x="6" y="10" width="52" height="48" fill="url(#bgBody)" />
    <!-- Top Calendar Header Strip -->
    <rect x="6" y="10" width="52" height="14" fill="url(#calHeader)" />
    <rect x="6" y="23.5" width="52" height="1" fill="#ffffff" fill-opacity="0.22" />
  </g>

  <!-- Specular Border -->
  <rect
    x="6.75"
    y="10.75"
    width="50.5"
    height="46.5"
    rx="12.25"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.18"
    stroke-width="1.5"
  />

  <!-- Top Calendar Binding Rings / Pegs -->
  <rect x="18" y="4" width="6" height="11" rx="3" fill="#0b0c10" stroke="#6ee7b7" stroke-width="2" />
  <rect x="40" y="4" width="6" height="11" rx="3" fill="#0b0c10" stroke="#38bdf8" stroke-width="2" />

  <!-- Subtle Grid Divider Lines -->
  <line x1="23" y1="27" x2="23" y2="54" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />
  <line x1="41" y1="27" x2="41" y2="54" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" />

  <!-- Schedule Timeline / Milestone Bars Inside Calendar -->
  <!-- Row 1: Sky Blue Bar -->
  <rect x="13" y="30" width="24" height="5.5" rx="2.75" fill="url(#barSky)" />
  <circle cx="46.5" cy="32.75" r="2.75" fill="#9ca4f8" />

  <!-- Row 2: Mint Emerald Bar + Today Highlight -->
  <rect x="21" y="39" width="28" height="5.5" rx="2.75" fill="url(#barMint)" />
  <rect x="13" y="39" width="5.5" height="5.5" rx="1.8" fill="#ebd66b" />

  <!-- Row 3: Accent Bar -->
  <rect x="13" y="48" width="16" height="5" rx="2.5" fill="#fcae74" fill-opacity="0.92" />
  <rect x="32" y="48" width="17" height="5" rx="2.5" fill="#9ca4f8" fill-opacity="0.88" />
</svg>
